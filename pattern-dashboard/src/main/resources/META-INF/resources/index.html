<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LangChain4j Agentic Patterns — Zao Dashboard</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --panel2:#eef1f7; --ink:#111827; --muted:#5b6472;
    --line:#d7dce6; --accent:#4f46e5; --accent2:#0ea5e9;
    --node:#ffffff; --node-line:#c3cad8; --node-active:#fde68a; --node-active-line:#d97706;
    --node-done:#bbf7d0; --node-done-line:#16a34a; --board:#e0e7ff; --board-line:#6366f1;
    --c-start:#6b7280; --c-before:#2563eb; --c-after:#16a34a; --c-error:#dc2626;
    --c-result:#7c3aed; --c-done:#6b7280;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0f17; --panel:#131a26; --panel2:#0f1622; --ink:#e6ebf2; --muted:#9aa6b8;
      --line:#243043; --accent:#818cf8; --accent2:#38bdf8;
      --node:#1a2333; --node-line:#33415a; --node-active:#78591b; --node-active-line:#fbbf24;
      --node-done:#14532d; --node-done-line:#22c55e; --board:#1e2a52; --board-line:#818cf8;
      --c-start:#9ca3af; --c-before:#60a5fa; --c-after:#4ade80; --c-error:#f87171;
      --c-result:#c4b5fd; --c-done:#9ca3af;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header.top{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex:0 0 auto}
  header.top h1{font-size:20px;margin:0;font-weight:700}
  header.top .sub{color:var(--muted);font-size:14px}
  .railtoggle{flex:0 0 auto;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:15px;line-height:1;cursor:pointer}
  .railtoggle:hover{background:var(--panel2);border-color:var(--accent)}
  .layout{display:flex;flex:1 1 auto;min-height:0}
  /* left rail — collapsible, to hand the diagram the full width on a projector */
  .rail{width:250px;flex:0 0 auto;border-right:1px solid var(--line);overflow-y:auto;background:var(--panel2);padding:10px;transition:width .15s ease}
  body.rail-hidden .rail{width:0;padding-left:0;padding-right:0;border-right:0;visibility:hidden;
    /* delay hiding until the slide finishes, so collapsed buttons stop taking focus */
    transition:width .15s ease, visibility 0s linear .15s}
  .rail h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 8px 6px}
  .rail button{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:2px}
  .rail button:hover{background:var(--panel)}
  .rail button.active{background:var(--accent);color:#fff;font-weight:600}
  /* center */
  .main{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
  .head{padding:16px 22px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .head h2{margin:0 0 4px;font-size:24px}
  .head .useful{color:var(--muted);font-size:15px}
  .caveat{margin-top:10px;background:color-mix(in srgb,#f59e0b 18%,transparent);border:1px solid #f59e0b;border-radius:8px;padding:8px 12px;font-size:14px}
  /* The graph now owns the whole stage: result and scope moved into the dock's tabs. */
  .graphwrap{flex:1 1 auto;min-width:0;min-height:0;position:relative}
  svg{width:100%;height:100%;display:block}
  /* Scope pane: a debugger's variables table — name, type, value, and what just changed. */
  #scope{padding:0}
  #scope .empty{display:block;padding:10px 14px}
  table.vars{width:100%;border-collapse:collapse;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  table.vars th{position:sticky;top:0;z-index:1;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--panel2);border-bottom:1px solid var(--line);padding:6px 10px}
  table.vars td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.vars tr:hover td{background:var(--panel2)}
  table.vars .name{color:var(--accent2);font-weight:700;white-space:nowrap}
  table.vars .type{color:var(--muted);white-space:nowrap}
  table.vars .val{width:100%;word-break:break-word;white-space:pre-wrap}
  /* Long agent output would swamp the table, so clamp it and let a click open the row. */
  table.vars .val.clamped{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  table.vars tr.expandable{cursor:pointer}
  table.vars tr.changed td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  table.vars tr.changed .name{position:relative}
  table.vars tr.changed .name::before{content:'';position:absolute;left:-10px;top:-5px;bottom:-5px;width:3px;background:var(--accent)}
  /* #result holds rendered markdown, so block spacing comes from the elements, not pre-wrap.
     Prose gets a readable measure rather than stretching the full width of a projector. */
  #result{overflow-wrap:anywhere}
  #result .md{max-width:70ch}
  #result > :first-child, #result .md > :first-child{margin-top:0}
  #result p{margin:0 0 8px}
  #result h1,#result h2,#result h3,#result h4,#result h5,#result h6{margin:14px 0 6px;line-height:1.25;font-weight:700}
  #result h1{font-size:19px} #result h2{font-size:17px} #result h3{font-size:16px}
  #result h4,#result h5,#result h6{font-size:14px;color:var(--muted)}
  #result ul,#result ol{margin:0 0 8px;padding-left:22px}
  #result li{margin:3px 0}
  #result code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  #result pre{margin:0 0 8px;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
  #result pre code{border:0;background:none;padding:0;white-space:pre}
  #result blockquote{margin:0 0 8px;padding:2px 0 2px 10px;border-left:3px solid var(--board-line);color:var(--muted)}
  #result hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  #result a{color:var(--accent2)}
  /* controls — directly under the title, above the diagram: the run is the first thing you do */
  .controls{padding:10px 22px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex:0 0 auto;background:var(--panel2)}
  .controls input{flex:1 1 auto;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:15px}
  .controls button{padding:9px 18px;border-radius:8px;border:none;font-weight:700;font-size:15px;cursor:pointer}
  .btn-run{background:var(--accent);color:#fff}
  .btn-reset{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .controls button:disabled{opacity:.5;cursor:not-allowed}
  /* bottom dock: run events + server log */
  /* Taller than a pure log strip: the result and the scope live in here now. Drag-resizable,
     because how much room the log deserves depends on which pattern is being demoed. */
  .dock{height:34vh;min-height:120px;flex:0 0 auto;border-top:1px solid var(--line);display:flex;flex-direction:column}
  .grip{height:7px;flex:0 0 auto;cursor:ns-resize;background:var(--panel2);border-bottom:1px solid var(--line);position:relative}
  .grip::after{content:'';position:absolute;left:50%;top:3px;width:38px;height:2px;margin-left:-19px;border-radius:2px;background:var(--line)}
  .grip:hover::after,.grip:focus-visible::after{background:var(--accent)}
  .grip:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  body.resizing{cursor:ns-resize;user-select:none}
  .tabs{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--panel2);border-bottom:1px solid var(--line);flex:0 0 auto}
  .tab{background:none;border:1px solid transparent;color:var(--muted);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
  .tab:hover{background:var(--panel)}
  .tab.active{background:var(--panel);color:var(--ink);border-color:var(--line)}
  .tab .dot{color:#f87171;font-size:16px;line-height:0;vertical-align:middle}
  .tabs .spacer{flex:1 1 auto}
  .tabs select,.tabs .mini{font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .pane{flex:1 1 auto;overflow-y:auto;padding:10px 14px;min-height:0}
  /* Streams read as a terminal; result and scope read as a document. */
  .pane.term{background:#000;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;padding:8px 12px}
  .pane.doc{background:var(--panel);font-size:14px}
  .pane .line{white-space:pre-wrap;word-break:break-word}
  .empty{color:var(--muted);font-style:italic}
  .seq,.time{color:#6b7280}
  .logger{color:#a78bfa}
  .lvl-ERROR{color:#f87171;font-weight:700}
  .lvl-WARN{color:#fbbf24;font-weight:700}
  .lvl-INFO{color:#93c5fd}
  .lvl-DEBUG,.lvl-TRACE{color:#6b7280}
  /* svg node classes set via attributes */
  .node rect{fill:var(--node);stroke:var(--node-line);stroke-width:1.5}
  .node.board rect{fill:var(--board);stroke:var(--board-line);stroke-dasharray:5 3}
  /* A join is a step, not an agent — drawn plainer so it never reads as one. */
  .node.join rect{fill:var(--panel2);stroke:var(--node-line);stroke-dasharray:4 3}
  .node.join text{fill:var(--muted);font-style:italic}
  .node.active rect{fill:var(--node-active);stroke:var(--node-active-line);stroke-width:2.5}
  .node.done rect{fill:var(--node-done);stroke:var(--node-done-line)}
  .node text{fill:var(--ink);font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
  .edge{stroke:var(--node-line);stroke-width:1.6;fill:none;marker-end:url(#arrow)}
  .edge.back{stroke:var(--accent2);stroke-dasharray:5 4}
  .edgelabel{fill:var(--muted);font-size:11px;text-anchor:middle}
</style>
</head>
<body>
<header class="top">
  <button class="railtoggle" id="rail-toggle" aria-expanded="true" aria-controls="rail" title="Show/hide the pattern list">☰</button>
  <h1>🐕 LangChain4j Agentic Patterns</h1>
  <span class="sub">Live-running all 13 patterns, themed around the Belgian shepherd <b>Zao</b> and his pack — from puppy to pack.</span>
</header>
<div class="layout">
  <nav class="rail" id="rail"></nav>
  <section class="main">
    <div class="head">
      <h2 id="p-name">Select a pattern</h2>
      <div class="useful" id="p-useful"></div>
      <div class="caveat" id="p-caveat" style="display:none"></div>
    </div>
    <div class="controls">
      <input id="input" placeholder="input for the pattern"/>
      <button class="btn-run" id="run">▶ Run</button>
      <button class="btn-reset" id="reset">Reset</button>
    </div>
    <div class="graphwrap"><svg id="graph" viewBox="0 0 820 440" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="dock" id="dock">
      <div class="grip" id="grip" role="separator" aria-orientation="horizontal" tabindex="0"
           title="Drag to resize — double-click to reset"></div>
      <div class="tabs">
        <button class="tab" data-pane="result">Result <span class="dot" id="result-dot" hidden>•</span></button>
        <button class="tab" data-pane="scope">Scope state</button>
        <button class="tab active" data-pane="console">Run events</button>
        <button class="tab" data-pane="log">Server log <span class="dot" id="log-dot" hidden>•</span></button>
        <span class="spacer"></span>
        <select id="log-level" title="minimum level" style="display:none">
          <option value="ALL">all levels</option>
          <option value="INFO" selected>INFO and up</option>
          <option value="WARN">WARN and up</option>
          <option value="ERROR">errors only</option>
        </select>
        <button class="mini" id="pane-clear">clear</button>
      </div>
      <div class="pane doc" id="result" hidden><span class="empty">no run yet</span></div>
      <div class="pane doc" id="scope" hidden><span class="empty">— empty —</span></div>
      <div class="pane term" id="console"></div>
      <div class="pane term" id="log" hidden></div>
    </div>
  </section>
</div>
<script>
const CAT_LABELS = {"workflow":"Workflows","pure-agent":"Pure agents","pattern-zoo":"Pattern zoo"};
let patterns = [], current = null, es = null;

async function boot(){
  patterns = await (await fetch('/api/patterns')).json();
  const rail = document.getElementById('rail');
  const groups = {};
  patterns.forEach(p => (groups[p.category] ||= []).push(p));
  Object.keys(CAT_LABELS).forEach(cat => {
    if(!groups[cat]) return;
    const h = document.createElement('h3'); h.textContent = CAT_LABELS[cat]; rail.appendChild(h);
    groups[cat].forEach(p => {
      const b = document.createElement('button'); b.textContent = p.name; b.dataset.id = p.id;
      b.onclick = () => select(p.id); rail.appendChild(b);
    });
  });
  if(patterns.length) select(patterns[0].id);
}

function select(id){
  if(es){ es.close(); es=null; }
  current = patterns.find(p => p.id===id);
  document.querySelectorAll('.rail button').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  document.getElementById('p-name').textContent = current.name;
  document.getElementById('p-useful').textContent = current.useful;
  const cav = document.getElementById('p-caveat');
  cav.style.display='block'; cav.innerHTML = '⚠ <b>Caveat:</b> ' + current.caveat;
  document.getElementById('input').value = current.defaultInput || '';
  reset();
  // Result and scope were just cleared, so land on the tab that has something to show.
  showPane('console');
  drawGraph(current.topology);
}

function reset(){
  document.getElementById('console').innerHTML='';
  document.getElementById('scope').innerHTML='<span class="empty">— empty —</span>';
  lastScope={}; expandedVars.clear();
  document.getElementById('result').innerHTML='<span class="empty">no run yet</span>';
  document.getElementById('result-dot').hidden=true;
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('active','done'));
}

/* ---------- graph layout & drawing ---------- */
const W=820,H=440,NW=150,NH=46;
function leadTok(s){ return (s||'').split(/[\s(]/)[0]; }

function layout(topo){
  const nodes = topo.nodes.map(n=>({...n}));
  const idx = {}; nodes.forEach((n,i)=>idx[n.id]=n);
  const lay = topo.layout;
  const cx=W/2, cy=H/2;
  const agents = nodes.filter(n=>n.role!=='board'&&n.role!=='supervisor'&&n.role!=='input'&&n.role!=='router');

  if(lay==='chain'||lay==='dag'||lay==='loop'){
    const n=nodes.length, gap=W/(n+1);
    nodes.forEach((nd,i)=>{ nd.x=gap*(i+1); nd.y=cy; });
  } else if(lay==='branch'){
    /* Three columns, because a router that sits in the same column as its branches doesn't
       look like routing at all: input -> router -> one of N. */
    const src = nodes.find(n=>n.role==='input');
    const router = nodes.find(n=>n.role==='router');
    const branches = nodes.filter(n=>n!==src&&n!==router);
    if(src){ src.x=105; src.y=cy; }
    if(router){ router.x=cx-20; router.y=cy; }
    const step=H/(branches.length+1);
    branches.forEach((b,i)=>{ b.x=W-125; b.y=step*(i+1); });
  } else if(lay==='fanout'){
    /* Fan out on the left, join on the right. The join is what makes this a parallel workflow
       rather than three unrelated calls, so it anchors the layout when present. */
    const src = nodes.find(n=>n.role==='input')||nodes[0];
    const sink = nodes.find(n=>n.role==='join')||nodes.find(n=>n.role==='board');
    const mids = nodes.filter(n=>n!==src&&n!==sink);
    src.x = sink ? 110 : W*0.3; src.y = cy;
    if(sink){ sink.x=W-110; sink.y=cy; }
    const midX = sink ? cx : W*0.7;
    const step=H/(mids.length+1);
    mids.forEach((m,i)=>{ m.x=midX; m.y=step*(i+1); });
  } else if(lay==='star'){
    const center = nodes.find(n=>n.role==='supervisor')||nodes.find(n=>n.role==='board')||nodes[0];
    const others = nodes.filter(n=>n!==center);
    center.x=cx; center.y=cy;
    const R=150;
    others.forEach((o,i)=>{ const a=-Math.PI/2 + i*2*Math.PI/others.length; o.x=cx+R*Math.cos(a); o.y=cy+R*Math.sin(a); });
  } else { // mesh
    const R=150;
    nodes.forEach((nd,i)=>{ const a=-Math.PI/2 + i*2*Math.PI/nodes.length; nd.x=cx+R*Math.cos(a); nd.y=cy+R*Math.sin(a); });
  }
  return {nodes, idx};
}

function drawGraph(topo){
  const svg=document.getElementById('graph');
  svg.innerHTML='<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M0 0L10 5L0 10z" fill="var(--node-line)"/></marker></defs>';
  const {nodes,idx}=layout(topo);
  const order={}; topo.nodes.forEach((n,i)=>order[n.id]=i);
  /* A->B and B->A drawn as straight lines land exactly on top of each other, so a mutual
     relationship (debate rebuttals, supervisor invoke/result, blackboard read/write) rendered
     as one arrow. Bow each side of such a pair the opposite way. */
  /* Chain-like layouts already separate a mutual pair by arcing the return edge overhead
     (that is how the loop's exit condition reads), so bowing the forward edge too would just
     make a straight pipeline wobble. */
  const arcLayout = topo.layout==='chain'||topo.layout==='loop'||topo.layout==='dag';
  const pairs=new Set(topo.edges.map(e=>e.from+'->'+e.to));
  const isMutual = e => !arcLayout && pairs.has(e.to+'->'+e.from);

  topo.edges.forEach(e=>{
    const a=idx[e.from], b=idx[e.to]; if(!a||!b) return;
    const back = order[e.to] < order[e.from];
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    let lx=(a.x+b.x)/2, ly=(a.y+b.y)/2 - 8;
    if(back && (topo.layout==='chain'||topo.layout==='loop'||topo.layout==='dag')){
      const arc=Math.min(a.y,b.y)-70;
      p.setAttribute('d',`M${a.x} ${a.y-NH/2} C ${a.x} ${arc}, ${b.x} ${arc}, ${b.x} ${b.y-NH/2}`);
      p.setAttribute('class','edge back');
      ly=(a.y+b.y)/2 - 60;
    } else if(isMutual(e)){
      // Perpendicular offset, signed consistently so the two halves bow apart, not together.
      const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
      const dir=(e.from<e.to)?1:-1, bow=26*dir;
      const mx=(a.x+b.x)/2 - dy/len*bow, my=(a.y+b.y)/2 + dx/len*bow;
      p.setAttribute('d',`M${a.x} ${a.y} Q ${mx} ${my}, ${b.x} ${b.y}`);
      p.setAttribute('class','edge'+(back?' back':''));
      lx=(a.x+b.x)/2 - dy/len*bow*0.75; ly=(a.y+b.y)/2 + dx/len*bow*0.75;
    } else {
      p.setAttribute('d',`M${a.x} ${a.y} L ${b.x} ${b.y}`);
      p.setAttribute('class','edge');
    }
    svg.appendChild(p);
    if(e.label){
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',lx); t.setAttribute('y',ly);
      t.setAttribute('class','edgelabel'); t.textContent=e.label; svg.appendChild(t);
    }
  });
  // nodes
  nodes.forEach(n=>{
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','node '+(n.role==='board'||n.role==='join'?n.role:'')); g.dataset.id=n.id; g.dataset.tok=leadTok(n.label);
    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',n.x-NW/2); r.setAttribute('y',n.y-NH/2); r.setAttribute('width',NW); r.setAttribute('height',NH); r.setAttribute('rx',10);
    g.appendChild(r);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',n.x); t.setAttribute('y',n.y);
    const lbl=n.label.length>20?n.label.slice(0,19)+'…':n.label;
    t.textContent=lbl; g.appendChild(t);
    svg.appendChild(g);
  });
}

function markNode(agent, cls){
  if(!agent) return;
  /* Fan-out agents report indexed names (TopicAnalyzer_0, ActivityPlanner$1); the topology
     node is labelled with the bare type, so strip the index before matching. */
  const base=String(agent).replace(/[_$]\d+$/,'');
  document.querySelectorAll('.node').forEach(g=>{
    if(g.dataset.tok && (g.dataset.tok===agent || g.dataset.tok===base)){
      if(cls==='active'){ g.classList.add('active'); }
      else { g.classList.remove('active'); g.classList.add('done'); }
    }
  });
}

/* ---------- run / SSE ---------- */
function log(ev){
  const c=document.getElementById('console');
  const colors={'run-start':'--c-start','agent-before':'--c-before','agent-after':'--c-after','agent-error':'--c-error','run-result':'--c-result','run-done':'--c-done'};
  const div=document.createElement('div'); div.className='line';
  const col=`var(${colors[ev.type]||'--c-done'})`;
  div.innerHTML=`<span class="seq">[${ev.seq}]</span> <span style="color:${col};font-weight:700">${ev.type}</span> <span style="color:var(--accent2)">${ev.agent||''}</span> — <span style="color:${col}">${escapeHtml(ev.message||'')}</span>`;
  c.appendChild(div); c.scrollTop=c.scrollHeight;
}
function escapeHtml(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

/* ---------- tiny markdown renderer ----------
   Models answer in markdown — ### headings, **bold**, bullet lists, fenced code — and a wall of
   raw asterisks is unreadable from the back of a room. A library would have to come off a CDN,
   which is the one thing guaranteed to fail on conference wifi, so this covers the subset an LLM
   actually emits and nothing else.

   Order matters for safety: the text is HTML-escaped BEFORE any tag is introduced, so nothing the
   model returns can inject markup. Only the tags generated below ever reach the DOM. */
const MD_CODE = '\u0000CODE';

function renderMarkdown(src){
  const codeBlocks = [];
  // Fenced code comes out first, so the inline rules below can't rewrite its contents.
  let s = String(src ?? '').replace(/```[^\n]*\n?([\s\S]*?)```/g, (_, body) => {
    codeBlocks.push('<pre><code>' + escapeHtml(body.replace(/\n$/, '')) + '</code></pre>');
    return MD_CODE + (codeBlocks.length - 1) + '\u0000';
  });
  s = escapeHtml(s);

  const out = [];
  let para = [], quote = [], list = null;
  const flushPara = () => { if(para.length){ out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
  const flushQuote = () => { if(quote.length){ out.push('<blockquote>' + quote.join('<br>') + '</blockquote>'); quote = []; } };
  const flushList = () => { if(list){ out.push('</' + list + '>'); list = null; } };
  const flush = () => { flushPara(); flushQuote(); flushList(); };
  const openList = (kind) => { if(list !== kind){ flushList(); out.push('<' + kind + '>'); list = kind; } };

  for(const line of s.split('\n')){
    const t = line.trim();
    let m;
    if(!t){ flush(); continue; }
    if(t.includes(MD_CODE)){ flush(); out.push(t); continue; }
    if(m = t.match(/^(#{1,6})\s+(.*)$/)){
      flush(); out.push(`<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`); continue;
    }
    if(/^([-*_])\1{2,}$/.test(t)){ flush(); out.push('<hr>'); continue; }
    // Escaping already ran, so a quote marker reaches this loop as &gt;, never as >.
    // Consecutive quoted lines accumulate into one blockquote instead of a stack of boxes.
    if(m = t.match(/^&gt;\s?(.*)$/)){ flushPara(); flushList(); quote.push(mdInline(m[1])); continue; }
    if(m = t.match(/^[-*+]\s+(.*)$/)){ flushPara(); flushQuote(); openList('ul'); out.push('<li>' + mdInline(m[1]) + '</li>'); continue; }
    if(m = t.match(/^\d+[.)]\s+(.*)$/)){ flushPara(); flushQuote(); openList('ol'); out.push('<li>' + mdInline(m[1]) + '</li>'); continue; }
    flushQuote(); flushList();
    para.push(mdInline(t));
  }
  flush();

  return out.join('').replace(/\u0000CODE(\d+)\u0000/g, (_, i) => codeBlocks[+i]);
}

function mdInline(t){
  return t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_]+)__/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (whole, label, href) => {
      /* Only schemes that can't execute, and quotes encoded so a URL can't escape the attribute
         (escapeHtml deliberately leaves quotes alone, which is fine in text but not in href). */
      if(!/^(https?:|mailto:)/i.test(href)) return whole;
      const safe = href.replace(/"/g, '%22').replace(/'/g, '%27');
      return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    });
}

/* Which rows changed on the last event, so the table reads like a debugger stepping: you can
   see exactly which variable an agent just wrote. Keyed by name -> value. */
let lastScope={};
let expandedVars=new Set();

function updateScope(scope){
  if(!scope) return;
  const keys=Object.keys(scope); if(!keys.length) return;
  const el=document.getElementById('scope');
  const rows=keys.map(k=>{
    const v=scope[k]||{};
    const changed = !(k in lastScope) || lastScope[k]!==v.value;
    const expanded = expandedVars.has(k);
    const type = v.type + (v.size!=null ? '(' + v.size + ')' : '');
    return `<tr class="${changed?'changed ':''}expandable" data-var="${escapeHtml(k)}">`
      + `<td class="name">${escapeHtml(k)}</td>`
      + `<td class="type">${escapeHtml(type)}</td>`
      + `<td class="val${expanded?'':' clamped'}">${escapeHtml(v.value)}</td></tr>`;
  }).join('');
  el.innerHTML = '<table class="vars"><thead><tr><th>name</th><th>type</th><th>value</th></tr>'
    + `</thead><tbody>${rows}</tbody></table>`;
  el.querySelectorAll('tr.expandable').forEach(tr=>tr.onclick=()=>{
    const k=tr.dataset.var;
    if(expandedVars.has(k)) expandedVars.delete(k); else expandedVars.add(k);
    tr.querySelector('.val').classList.toggle('clamped');
  });
  lastScope={}; keys.forEach(k=>lastScope[k]=(scope[k]||{}).value);
}

/* The result is a tab now, so a finished run would otherwise be invisible. Switch to it on
   completion — unless the viewer picked a tab themselves during this run, in which case leave
   them where they are and just flag the tab. */
let tabPinned=false;
function revealResult(){
  if(!tabPinned) showPane('result');
  else if(activePane()!=='result') document.getElementById('result-dot').hidden=false;
}

function run(){
  if(!current) return;
  reset();
  tabPinned=false;
  const input=encodeURIComponent(document.getElementById('input').value||'');
  document.getElementById('run').disabled=true;
  es=new EventSource(`/api/patterns/${current.id}/run?input=${input}`);
  es.onmessage=e=>{
    let ev; try{ ev=JSON.parse(e.data); }catch(_){ return; }
    log(ev); updateScope(ev.scope);
    if(ev.type==='agent-before') markNode(ev.agent,'active');
    else if(ev.type==='agent-after') markNode(ev.agent,'done');
    else if(ev.type==='run-result'){
      document.getElementById('result').innerHTML = ev.data!=null
        ? '<div class="md">' + renderMarkdown(ev.data) + '</div>'
        : '<span class="empty">(no output)</span>';
      revealResult();
    } else if(ev.type==='run-done'){
      es.close(); es=null; document.getElementById('run').disabled=false;
    }
  };
  es.onerror=()=>{ if(es){es.close();es=null;} document.getElementById('run').disabled=false; };
}

/* ---------- bottom dock: run events + live server log ---------- */
const LEVEL_RANK={TRACE:0,DEBUG:1,INFO:2,WARN:3,ERROR:4};
let logLines=[];

const PANES=['result','scope','console','log'];
function showPane(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.pane===name));
  PANES.forEach(p=>document.getElementById(p).hidden = p!==name);
  /* Per-tab controls: a level filter only means something for the log, and "clear" would be
     meaningless on panes that mirror the current run. */
  document.getElementById('log-level').style.display = name==='log' ? '' : 'none';
  document.getElementById('pane-clear').style.display = (name==='log'||name==='console') ? '' : 'none';
  if(name==='log') document.getElementById('log-dot').hidden = true;
  if(name==='result') document.getElementById('result-dot').hidden = true;
}
function activePane(){ return document.querySelector('.tab.active').dataset.pane; }
function minLevel(){ return document.getElementById('log-level').value; }
function passes(l){ const m=minLevel(); return m==='ALL' || (LEVEL_RANK[l.level]??2) >= LEVEL_RANK[m]; }

function logHtml(l){
  return `<div class="line"><span class="time">${l.time}</span> `
    + `<span class="lvl-${l.level}">${String(l.level).padEnd(5)}</span> `
    + `<span class="logger">${escapeHtml(l.logger)}</span> ${escapeHtml(l.message)}</div>`;
}
function renderLog(){
  const el=document.getElementById('log');
  el.innerHTML = logLines.filter(passes).map(logHtml).join('');
  el.scrollTop = el.scrollHeight;
}
function appendLog(l){
  logLines.push(l);
  if(logLines.length>1000) logLines.shift();
  /* A problem you can't see is a problem you debug on stage: flag warnings on the tab. */
  if((l.level==='WARN'||l.level==='ERROR') && activePane()!=='log')
    document.getElementById('log-dot').hidden=false;
  if(!passes(l)) return;
  const el=document.getElementById('log');
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.insertAdjacentHTML('beforeend', logHtml(l));
  if(atBottom) el.scrollTop = el.scrollHeight;
}
function connectLogs(){
  /* EventSource reconnects by itself, which also covers a dev-mode restart. */
  const src=new EventSource('/api/logs');
  src.onmessage=e=>{ let l; try{ l=JSON.parse(e.data); }catch(_){ return; } appendLog(l); };
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ tabPinned=true; showPane(t.dataset.pane); });
document.getElementById('log-level').onchange=renderLog;
document.getElementById('pane-clear').onclick=()=>{
  if(activePane()==='log'){ logLines=[]; renderLog(); }
  else document.getElementById('console').innerHTML='';
};

/* ---------- layout chrome: collapsible rail, resizable dock ----------
   Both remembered in localStorage: the speaker arranges the room's view once, and a reload
   (or a dev-mode restart mid-talk) doesn't undo it. */
const DOCK_MIN=120, STAGE_MIN=260, PREFS='dashboard.layout';

function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(PREFS)) || {}; }catch(_){ return {}; } }
function savePrefs(patch){ try{ localStorage.setItem(PREFS, JSON.stringify({...loadPrefs(), ...patch})); }catch(_){} }

/* Prefer the height we last set over a measured rect: repeated drags would otherwise accumulate
   sub-pixel drift, and before the first resize there is no inline value to read. */
function dockHeight(){
  const dock=document.getElementById('dock');
  const inline=parseFloat(dock.style.height);
  return Number.isFinite(inline) ? inline : dock.getBoundingClientRect().height;
}
function dockMax(){ return Math.max(DOCK_MIN, window.innerHeight - STAGE_MIN); }
function setDockHeight(px, persist){
  const h = Math.round(Math.min(dockMax(), Math.max(DOCK_MIN, px)));
  document.getElementById('dock').style.height = h + 'px';
  if(persist) savePrefs({dock:h});
  return h;
}
function setRailHidden(hidden, persist){
  document.body.classList.toggle('rail-hidden', hidden);
  document.getElementById('rail-toggle').setAttribute('aria-expanded', String(!hidden));
  if(persist) savePrefs({railHidden:hidden});
}

document.getElementById('rail-toggle').onclick = () =>
  setRailHidden(!document.body.classList.contains('rail-hidden'), true);

(function dockResizing(){
  const grip=document.getElementById('grip');
  let startY=0, startH=0, active=false;
  grip.addEventListener('pointerdown', e=>{
    active=true; startY=e.clientY; startH=dockHeight();
    grip.setPointerCapture?.(e.pointerId);
    document.body.classList.add('resizing');
    e.preventDefault();
  });
  grip.addEventListener('pointermove', e=>{
    if(active) setDockHeight(startH + (startY - e.clientY), false);   // drag up = taller
  });
  const stop = e => {
    if(!active) return;
    active=false;
    document.body.classList.remove('resizing');
    try{ grip.releasePointerCapture?.(e.pointerId); }catch(_){}
    savePrefs({dock:Math.round(dockHeight())});
  };
  grip.addEventListener('pointerup', stop);
  grip.addEventListener('pointercancel', stop);
  grip.addEventListener('dblclick', ()=> setDockHeight(window.innerHeight*0.34, true));
  grip.addEventListener('keydown', e=>{
    const step = e.shiftKey ? 60 : 15;
    if(e.key==='ArrowUp') setDockHeight(dockHeight()+step, true);
    else if(e.key==='ArrowDown') setDockHeight(dockHeight()-step, true);
    else return;
    e.preventDefault();
  });
  // A shrinking window must never let the dock swallow the diagram.
  window.addEventListener('resize', ()=> setDockHeight(dockHeight(), false));
})();

(function applySavedLayout(){
  const p=loadPrefs();
  if(typeof p.dock === 'number') setDockHeight(p.dock, false);
  setRailHidden(!!p.railHidden, false);
})();

document.getElementById('run').onclick=run;
document.getElementById('reset').onclick=()=>{ if(es){es.close();es=null;} document.getElementById('run').disabled=false; reset(); };
boot();
connectLogs();
</script>
</body>
</html>
