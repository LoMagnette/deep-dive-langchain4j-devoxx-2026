<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Zao's Pack — LangChain4j Agentic Patterns</title>
<!-- The same drawn paw as the header, so the tab and the page share one mark. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='%23ad470b'%3E%3Cellipse cx='12' cy='16.6' rx='5.2' ry='4.3'/%3E%3Cellipse cx='5.5' cy='10.3' rx='2.3' ry='3'/%3E%3Cellipse cx='9.9' cy='7.3' rx='2.4' ry='3.2'/%3E%3Cellipse cx='14.5' cy='7.3' rx='2.4' ry='3.2'/%3E%3Cellipse cx='18.7' cy='10.4' rx='2.3' ry='3'/%3E%3C/g%3E%3C/svg%3E"/>
<script>
  /* Runs before the body renders. Any failure (no matchMedia, blocked storage) falls back to
     light rather than leaving the page unthemed. */
  try{
    var _p=JSON.parse(localStorage.getItem('dashboard.layout')||'{}');
    var _d=_p.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    document.documentElement.setAttribute('data-theme',_d);
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
</script>
<link rel="stylesheet" href="app.css"/>
<!-- Classic scripts, deferred: order is preserved and both run once the DOM is parsed. -->
<script src="render.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <button class="railtoggle" id="rail-toggle" aria-expanded="true" aria-controls="rail" title="Show/hide the pattern list">☰</button>
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
    <ellipse cx="12" cy="16.6" rx="5.2" ry="4.3"/><ellipse cx="5.5" cy="10.3" rx="2.3" ry="3"/>
    <ellipse cx="9.9" cy="7.3" rx="2.4" ry="3.2"/><ellipse cx="14.5" cy="7.3" rx="2.4" ry="3.2"/>
    <ellipse cx="18.7" cy="10.4" rx="2.3" ry="3"/>
  </svg>
  <h1><span class="pale">LangChain4j agentic patterns</span></h1>
  <div class="themeswitch" role="group" aria-label="Colour theme">
    <button id="theme-light" data-theme-choice="light" title="Light theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/>
        <g stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 2.7v2.3M12 19v2.3
          M21.3 12H19M5 12H2.7M18.6 5.4L17 7M7 17l-1.6 1.6M18.6 18.6L17 17M7 7L5.4 5.4"/></g></svg>Light</button>
    <button id="theme-dark" data-theme-choice="dark" title="Dark theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor"
        d="M20.1 14.6A8.5 8.5 0 1 1 9.4 3.9a6.9 6.9 0 0 0 10.7 10.7z"/></svg>Dark</button>
  </div>
</header>
<div class="layout">
  <nav class="rail" id="rail"></nav>
  <section class="main">
    <section class="gallery" id="gallery">
      <div class="gallery-head">
        <!-- Both lines are replaced from the catalogue on load, so the count can't go stale. -->
        <h2>Agentic patterns</h2>
        <p>Each one runs live against a real model. Pick one to try it.</p>
      </div>
      <!-- Filled from the catalogue: one section per category, cards inside each. -->
      <div class="groups" id="grid"></div>
    </section>
    <div class="head">
      <!-- The demos read in catalogue order as one continuous story, so you can walk the whole
           thing without going back to the grid. Real links, so Back and the keyboard work. -->
      <div class="walk">
        <a class="step" id="p-prev" href="#/"></a>
        <a class="back" href="#/">All patterns</a>
        <a class="step" id="p-next" href="#/"></a>
      </div>
      <h2 id="p-name">Select a pattern</h2>
      <div class="story" id="p-story"></div>
      <!-- What this demo inherits from earlier ones. Hidden when it stands alone. -->
      <div class="builds" id="p-builds" hidden></div>
      <!-- What the pattern is for and what it costs. Closed by default: on stage the story
           above is what gets said out loud, and this is what you open when somebody asks.
           Native <details>, so the toggle needs no script and the keyboard works. -->
      <details class="notes" id="p-notes">
        <summary>Why this pattern, and what it costs</summary>
        <div class="useful" id="p-useful"></div>
        <div class="caveat" id="p-caveat"></div>
      </details>
    </div>
    <div class="controls">
      <input id="input" placeholder="input for the pattern"/>
      <button class="btn-run" id="run" title="Run this pattern">Run</button>
      <button class="btn-reset" id="reset" title="Clear the run and start over">Reset</button>
      <!-- Shown only on the demo whose last agent returns a TokenStream. A toggle that does
           nothing on nineteen of twenty patterns reads as a broken control, not an absent
           feature, so the page asks the catalogue rather than guessing. -->
      <label class="toggle" id="p-stream-wrap" hidden
             title="Run the agent on a streaming model and show the answer as it is generated">
        <input type="checkbox" id="p-stream"/> stream tokens
      </label>
      <!-- How long the last run took. Hidden until there has been one, and hidden again the
           moment you reset or switch pattern: a stale number next to a Run button reads as
           this run's. -->
      <span class="ran" id="p-time" hidden></span>
    </div>
    <!-- Shown only while a run is stopped waiting for a person. The run is blocked on a thread
         until this is answered or it times out, which is the pattern, not a bug. -->
    <div class="ask" id="ask" hidden>
      <div class="ask-q" id="ask-q"></div>
      <div class="ask-row">
        <input id="ask-text" placeholder="approve it, change it, or refuse it"/>
        <button class="btn-run" id="ask-send">Send</button>
      </div>
    </div>
    <div class="graphwrap"><svg id="graph" viewBox="0 0 820 440" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="dock" id="dock">
      <div class="grip" id="grip" role="separator" aria-orientation="horizontal" tabindex="0"
           title="Drag to resize — double-click to reset"></div>
      <div class="tabs">
        <button class="tab" data-pane="result">Result <span class="dot" id="result-dot" hidden>•</span></button>
        <button class="tab" data-pane="scope">Scope state</button>
        <button class="tab active" data-pane="console">Run events</button>
        <button class="tab" data-pane="log">Server log <span class="dot" id="log-dot" hidden>•</span></button>
        <span class="spacer"></span>
        <select id="log-level" title="minimum level" style="display:none">
          <option value="ALL">all levels</option>
          <option value="INFO" selected>INFO and up</option>
          <option value="WARN">WARN and up</option>
          <option value="ERROR">errors only</option>
        </select>
        <button class="mini" id="pane-clear">clear</button>
      </div>
      <div class="pane doc" id="result" hidden><span class="empty">No run yet.</span></div>
      <div class="pane doc" id="scope" hidden><span class="empty">Empty until an agent writes to it.</span></div>
      <div class="pane term" id="console"></div>
      <div class="pane term" id="log" hidden></div>
    </div>
  </section>
</div>
</body>
</html>
