quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

# Model selection:
#   auto   (default) try the Ollama endpoint below; if it is unreachable, fall back to
#          the deterministic MockChatModel and log a loud warning. Never leaves you with 13
#          identically-failing demos because Ollama wasn't running.
#   ollama always use the endpoint below, no fallback — fail loudly if it is down.
#   mock   always the deterministic offline model.
dashboard.model=auto
# Target is a LOCAL Ollama server via the native langchain4j-ollama client (no /v1 suffix, no
# API key).
#
# Leave the base URL EMPTY to auto-discover it: ModelFactory probes localhost:11434 (Ollama on
# this machine — the normal case) and then host.docker.internal:11434 (app in a container,
# Ollama on the host). Hardcoding either one breaks the other environment, and it breaks
# invisibly: a host that does not resolve fails exactly like a stopped Ollama.
#
# Set OLLAMA_BASE_URL to pin one endpoint and skip discovery, e.g. a box on the LAN.
dashboard.ollama.base-url=${OLLAMA_BASE_URL:}
dashboard.ollama.model-name=${OLLAMA_MODEL:gemma4:e4b-mlx}
# Per-request timeout. Thinking models routinely spend >30s on a single agent step.
dashboard.ollama.timeout=${OLLAMA_TIMEOUT:PT2M}

# Swap back to real OpenAI (or any OpenAI-compatible endpoint) by re-enabling this block and the
# OpenAI branch in ModelFactory, and setting dashboard.model=openai.
#dashboard.openai.api-key=${OPENAI_API_KEY:ollama}
#dashboard.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
#dashboard.openai.model-name=${OPENAI_MODEL:gpt-4o-mini}

# Offline fallback for CI / this sandbox (no Ollama, no key): run with -Ddashboard.model=mock
%test.dashboard.model=mock
